# site settings

title: Paul Swisher | Veteran • Systems Engineer • Researcher
description: Systems engineer, US military veteran, and independent researcher with three patents pending.
taglong: Systems engineer, US military veteran, and independent researcher with three patents pending.
tagshort: Paul Swisher 
url: https://pswish.github.io
baseurl: ""
permalink: pretty
repo: https://github.com/pswish/pswish.github.io

# author settings

author:
  name: Paul Swisher
